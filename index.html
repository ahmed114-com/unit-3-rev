<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Unit 3 & Review 1 | 📝 تدريبات الدرس (Interactive Exercises)</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-soft: #f1f5f9;
      --bg-accent: #eff6ff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0ea5e9;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --vocab-highlight: #fef08a;
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --radius: 14px;
      --zoom-scale: 1;
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-soft: #334155;
      --bg-accent: #1e3a8a;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.18);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.18);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.18);
      --vocab-highlight: rgba(234, 179, 8, 0.35);
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-wrap: break-word;
      font-size: calc(16px * var(--zoom-scale));
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Compact Non-Sticky Header */
    .slim-header {
      position: relative;
      width: 100%;
      background: var(--bg-card);
      border-bottom: 2px solid var(--border-color);
      padding: clamp(8px, 1.5vw, 14px) clamp(12px, 2.5vw, 24px);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .lesson-title-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .lesson-main-title {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }

    .exercise-type-badge {
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: clamp(0.78rem, 1.4vw, 0.9rem);
      font-weight: 700;
    }

    .luxury-teacher-badge {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #93c5fd;
      padding: 5px 12px;
      border-radius: 999px;
      color: #1e3a8a;
      font-weight: 700;
      font-size: clamp(0.82rem, 1.5vw, 0.95rem);
    }

    [data-theme="dark"] .luxury-teacher-badge {
      background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
      color: #e0f2fe;
      border-color: #3b82f6;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .contact-btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .whatsapp-btn {
      background: #16a34a;
      color: #ffffff;
    }

    .call-btn {
      background: var(--primary);
      color: #ffffff;
      direction: ltr;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-soft);
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Main Layout */
    .app-container {
      max-width: 1400px;
      margin: 16px auto;
      padding: 0 clamp(10px, 2vw, 20px);
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 20px;
      align-items: start;
    }

    .app-container.sidebar-collapsed {
      grid-template-columns: 1fr;
    }

    .app-container.sidebar-collapsed .sidebar {
      display: none;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 800;
      color: var(--primary);
    }

    .nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-btn {
      width: 100%;
      min-height: 44px;
      text-align: right;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--bg-soft);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .badge-count {
      background: rgba(15, 23, 42, 0.12);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .nav-btn.active .badge-count {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* Stats & Filter Bar */
    .score-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: clamp(12px, 2vw, 18px);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stats-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      background: var(--bg-soft);
      border: 1px solid var(--border-color);
    }

    /* Study Notes Cards */
    .study-section-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: clamp(12px, 2.5vw, 24px);
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .study-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .vocab-study-item {
      background: var(--bg-soft);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .exam-sentence-item {
      background: var(--bg-soft);
      border-right: 4px solid var(--primary);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      direction: ltr;
      text-align: left;
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
    }

    /* Reading Passage Box */
    .passage-card {
      background: var(--bg-accent);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: clamp(14px, 2.5vw, 22px);
      margin-bottom: 18px;
      direction: ltr;
      text-align: left;
    }

    .passage-title {
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 1.05rem;
      direction: rtl;
      text-align: right;
    }

    /* Question Card */
    .q-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: clamp(12px, 2.5vw, 24px);
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease;
    }

    .q-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    .q-source-badge {
      background: var(--bg-soft);
      color: var(--primary);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.84rem;
    }

    .q-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-soft);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .mini-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .q-stem {
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      font-weight: 700;
      margin: 12px 0;
      direction: ltr;
      text-align: left;
      line-height: 1.7;
    }

    .q-stem.rtl-stem {
      direction: rtl;
      text-align: right;
    }

    .q-translation-box {
      display: none;
      background: var(--warning-bg);
      color: var(--text-main);
      border-right: 4px solid var(--warning);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: clamp(0.92rem, 1.8vw, 1.08rem);
      font-weight: 600;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 14px;
      direction: ltr;
    }

    .options-grid.rtl-options {
      direction: rtl;
    }

    .option-btn {
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-soft);
      color: var(--text-main);
      font-size: clamp(0.92rem, 1.8vw, 1.15rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .rtl-options .option-btn {
      text-align: right;
    }

    .option-btn:hover:not(.disabled) {
      border-color: var(--primary);
      background: var(--bg-accent);
    }

    .option-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .opt-letter {
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--primary);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .option-btn.correct-choice {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--text-main);
    }

    .option-btn.correct-choice .opt-letter {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .option-btn.wrong-choice {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--text-main);
    }

    .option-btn.wrong-choice .opt-letter {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .opt-speak-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Interactive Words */
    .translatable-word {
      cursor: pointer;
      padding: 1px 3px;
      border-radius: 4px;
      border-bottom: 1px dotted rgba(37, 99, 235, 0.45);
      transition: background-color 0.15s ease;
      display: inline;
    }

    .translatable-word:hover {
      background-color: rgba(37, 99, 235, 0.15);
    }

    .translatable-word.saved-in-vocab {
      background-color: var(--vocab-highlight);
      border-bottom: 2px solid var(--warning);
    }

    /* Teacher Explanation Box */
    .teacher-exp-box {
      display: none;
      margin-top: 16px;
      padding: clamp(12px, 2vw, 20px);
      border-radius: 12px;
      background: var(--bg-soft);
      border-right: 5px solid var(--primary);
      font-size: clamp(0.92rem, 1.8vw, 1.12rem);
      direction: rtl;
      text-align: right;
    }

    .exp-Option-breakdown {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exp-item {
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    /* Essay Question Area */
    .essay-textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-soft);
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 10px;
      resize: vertical;
    }

    .reveal-essay-btn {
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Floating Word Tooltip */
    #word-tooltip {
      position: fixed;
      display: none;
      z-index: 9999;
      width: 280px;
      max-width: calc(100vw - 20px);
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow-md);
      direction: rtl;
      text-align: right;
    }

    /* Bottom Floating Vocab Button & Sidebar Drawer Button */
    .floating-bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 900;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .fab-vocab-btn {
      min-height: 50px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-drawer-toggle {
      display: none;
      min-height: 50px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    /* Vocab Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5000;
      padding: 14px;
    }

    .modal-box {
      background: var(--bg-card);
      color: var(--text-main);
      width: 100%;
      max-width: 850px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: clamp(14px, 3vw, 26px);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    .footer-bar {
      margin-top: 40px;
      padding: 20px;
      background: var(--bg-card);
      border-top: 2px solid var(--border-color);
      text-align: center;
    }

    /* Responsive Media Queries */
    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: fixed;
        top: 0;
        right: -310px;
        width: 290px;
        height: 100vh;
        overflow-y: auto;
        z-index: 4000;
        transition: right 0.3s ease;
        border-radius: 0;
      }
      .sidebar.open-drawer {
        right: 0;
      }
      .mobile-drawer-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .header-inner {
        justify-content: center;
        text-align: center;
      }
    }

    @media (min-width: 769px) and (max-width: 1199px) {
      .options-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .app-container {
        max-width: 1400px;
        margin: 20px auto;
      }
    }
  </style>
</head>
<body>

  <!-- Compact Non-Sticky Header -->
  <header class="slim-header">
    <div class="header-inner">
      <div class="lesson-title-wrap">
        <h1 class="lesson-main-title" id="header-lesson-title">Unit 3 & Review 1</h1>
        <span class="exercise-type-badge">📝 تدريبات الدرس (Interactive Exercises)</span>
      </div>

      <div class="luxury-teacher-badge" id="header-teacher-badge">
        <!-- Populated dynamically by initTeacherBranding() -->
      </div>

      <div class="header-controls">
        <button class="ctrl-btn" onclick="toggleSidebarDesktop()" title="إخفاء/إظهار القائمة">🗂️ الأقسام</button>
        <button class="ctrl-btn" onclick="adjustZoom(0.08)" title="تكبير الخط للسبورة">A+</button>
        <button class="ctrl-btn" onclick="adjustZoom(-0.08)" title="تصغير الخط">A-</button>
        <button class="ctrl-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙 الوضع الليلي</button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="app-container" id="main-app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <span>🧭 خريطة تدريبات المراجعة</span>
        <button class="ctrl-btn" style="min-height:36px;min-width:36px;padding:4px 8px;" onclick="closeMobileDrawer()">✖</button>
      </div>
      <ul class="nav-list" id="sidebar-nav-list">
        <li><button class="nav-btn active" onclick="switchSection('all')"><span>📚 عرض كل التدريبات الشاملة</span><span class="badge-count" id="count-all">0</span></button></li>
        <li><button class="nav-btn" onclick="switchSection('study_notes')"><span>📖 ملخص الامتحان (Vocab & Writing & Grammar)</span><span class="badge-count">48</span></button></li>
        <li><button class="nav-btn" onclick="switchSection('sample_test_5')"><span>📝 Sample Test 5 (On Unit 3)</span><span class="badge-count" id="count-st5">42</span></button></li>
        <li><button class="nav-btn" onclick="switchSection('sample_test_6')"><span>📝 Sample Test 6 (On Unit 3)</span><span class="badge-count" id="count-st6">42</span></button></li>
        <li><button class="nav-btn" onclick="switchSection('azhar_bank')"><span>🕌 بنك أسئلة الأزهر الشريف</span><span class="badge-count" id="count-azhar">74</span></button></li>
        <li><button class="nav-btn" onclick="switchSection('review_1')"><span>🏆 Review 1 (Units 1, 2 & 3)</span><span class="badge-count" id="count-rev1">83</span></button></li>
        <li><button class="nav-btn" style="border-color:var(--danger);" onclick="switchSection('mistakes_bank')"><span>🔥 بنك الغلطات الذكي</span><span class="badge-count" id="count-mistakes" style="background:var(--danger);color:#fff;">0</span></button></li>
        <li><button class="nav-btn" style="border-color:var(--warning);" onclick="openVocabModal()"><span>📓 كشكول الكلمات التفاعلي</span><span class="badge-count" id="count-vocab-side" style="background:var(--warning);color:#fff;">0</span></button></li>
      </ul>

        translation: "اكتب مقالاً إقناعياً عن: «ارتداء الزي المدرسي الموحد في المدارس الثانوية».",
        modelAnswer: "Have you ever wondered how much stress teenagers face every morning just deciding what to wear to school? Wearing a school uniform in high schools is one of the most effective policies to create a focused, equal, and safe learning environment.\n\nFirst of all, school uniforms promote social equity among students. In high schools, students come from different economic backgrounds, and fashion trends can create unfair pressure on low-income families. When everyone wears the same uniform, nadie feels marginalized, and peer pressure disappears.\n\nSecondly, uniforms help students focus on their academic goals rather than their appearance. Studies show that schools with uniform policies experience higher discipline, stronger school pride, and fewer classroom distractions.\n\nIn conclusion, a school uniform is not a restriction on freedom; it is a badge of unity and equality. Let us support school uniform policies in all high schools so our students can focus on building their future rather than competing in a fashion show.",
        modelAnswerAr: "هل تساءلت يوماً عن حجم التوتر الذي يواجهه المراهقون كل صباح لمجرد تقرير ما سيرتدونه للمدرسة؟ يُعد ارتداء الزي المدرسي الموحد في المدارس الثانوية من أكثر السياسات فعالية لخلق بيئة تعليمية مركزة ومتساوية وآمنة. أولاً، يعزز الزي المدرسي العدالة الاجتماعية بين الطلاب ويمنع تهميش الطلاب من الأسر منخفضة الدخل. ثانياً، يساعد الطلاب على التركيز على أهدافهم الدراسية والانضباط. وخلاصة القول، الزي المدرسي رمز للوحدة والمساواة.",

        modelAnswer: "Title: Why Nature's Best Survivors Are Our Greatest Teachers!\n\nHey everyone! Have you ever felt overwhelmed when life suddenly changes your plans? Whenever I struggle with a big transition, I look at the animal kingdom—and honestly, animals are the ultimate masters of adaptation and resilience!\n\nTake migrating birds, for example. When winter hits and food becomes scarce, they don't complain or give up; they work together in flocks and fly thousands of miles to warmer zones. Similarly, desert animals have developed amazing ways to conserve water during prolonged droughts.\n\nWhat can we learn from them? First, flexibility is key to survival. Second, teamwork makes tough journeys easier. Instead of fearing change, we can adjust our mindset and grow stronger.\n\nWhat is your favorite example of animal resilience? Drop your thoughts in the comments below!",

        translation: "اكتب فقرة من 6 أسطر: مقدمة لمقال جدلي يدعي أن «وسائل التواصل الاجتماعي تضر بالصحة النفسية للمراهقين أكثر مما تنفعهم».",
        modelAnswer: "In today's digital age, teenagers spend hours every day scrolling through social media platforms to stay connected and entertained. While supporters argue that these apps help young people express themselves and build online communities, the hidden psychological costs cannot be ignored. Recent scientific studies indicate that excessive screen time exposes adolescents to cyberbullying, unrealistic life comparisons, and sleep deprivation. Instead of fostering genuine friendship, virtual interactions often deepen feelings of loneliness, anxiety, and depression. Although social media offers some communication benefits, its negative impact on young minds is far more profound. Therefore, this essay argues that social media ultimately does much more harm than good for teenagers' mental health.",
        modelAnswerAr: "في عصرنا الرقمي اليوم، يقضي المراهقون ساعات يومياً في تصفح منصات التواصل الاجتماعي للبقاء على اتصال والترفيه. وبينما يجادل المؤيدون بأن هذه التطبيقات تساعد الشباب على التعبير عن أنفسهم، لا يمكن تجاهل التكلفة النفسية الخفية. فالدراسات الحديثة تشير إلى أن الاستخدام المفرط يعرض المراهقين للتنمر الإلكتروني والمقارنات غير الواقعية والقلق والاكتئاب والعزلة. ولذلك، يجادل هذا المقال بأن وسائل التواصل الاجتماعي تضر بالصحة النفسية للمراهقين أكثر بكثير مما تنفعهم.",
        teacherReasoning: "المستر طبق لك شروط مقدمة المقال الجدلي (Argumentative Introduction): عرض القضية، الإشارة للرأي المخالف، ثم إثبات الأطروحة القوية (Thesis Statement) في الجملة الأخيرة."

      {

        section: "review_1",
        sourceBadge: "📍 المصدر: Review 1 - كتابة مقدمة تدوينة (Writing 3b)",
        type: "essay",
        stem: "3. b) Write a paragraph of Six lines: Write an engaging introductory paragraph for a blog post titled: \"Why Taking Mental Health Days Should Be Normalized at Work.\"",
        translation: "اكتب فقرة افتتاحية جذابة من 6 أسطر لتدوينة بعنوان: «لماذا يجب أن يصبح أخذ أيام إجازة للصحة النفسية أمراً طبيعياً في العمل».",
        modelAnswer: "Have you ever woken up on a workday feeling completely exhausted, even though you didn't have a fever or a cough? If you break a bone or catch the flu, nobody questions why you need a day off to recover—so why do we treat our brains any differently? For years, workplace culture has pushed us to ignore burnout and keep smiling through constant stress and tight deadlines. From my own experience, pushing through mental exhaustion only leads to mistakes, chaos, and zero productivity. Taking a mental health day isn't a sign of laziness; it's a smart way to recharge your resilience and protect your well-being. Let's talk about why normalizing mental health days is the best investment any company can make!",

    Object.assign(PASSAGES, {
      st6_p1: `<strong>Read the following passage:</strong><br>The internet has had a profound effect on our lives, especially in fields of studying. Today, many students surf the net when they have to do research for a school or university task. The traditional method of going to a library and searching through archives and books is in decline. The rise of online digital encyclopedias such as Wikipedia first had a big impact on the sales of encyclopedias in the traditional printed format. Many publishers have given up producing encyclopedias on paper because people have stopped buying them. The other victims of the success of virtual information have been libraries.<br>Why do you go to a library if you can find everything you need to know on your computer? Furthermore, internet sites have access to thousands of books that are not affected by copyright. With a click of your mouse, classical literature is available online for free. Libraries in Britain have seen a fall in the number of people using them because of the internet.<br>However, not all libraries see the internet as an enemy. The Bibliotheca Alexandrina in Egypt is working with the Internet Archive, and the library stores a copy of all the website digital material at the library in Alexandria. The library now has an incredible physical and virtual collection. Other libraries are cataloging their materials online and making a lot of them available through the internet. In this way, they will have both real and virtual users.`,
      st6_p2: `<strong>Read the following passage:</strong><br>I am so sorry to tell you the worst story in my life. It happened eight years ago. One day, I asked my father for some money. It was the first time to hear his answer, "Not Now!". He said that angrily. I was the only son after three daughters and I used to find everything I wanted. That nervous answer, "Not Now!", was a shock to me. In fact, my mother was very ill, and a doctor came as my father phoned him. My sisters were running from one room to another. There were some neighbours who came home to help. I didn't try to understand what was happening. I only wanted money. There was a bag on the table. The bag was open and I could see some money and other things inside it.<br>Quickly, I took the bag and went out. After about an hour, I returned home. Now, it was a more terrible shock. There were more and more people. My mother had died! My father and sisters were crying so badly. While I was looking at them next to my dead mother, I heard someone shouting, "If the doctor's bag hadn't disappeared, he would have used his mobile or that medicine to save her!"`,
      azhar_p1: `<strong>Read the following passage (الأزهر أدبي ٢٠٢٥):</strong><br>Alaska is the largest US state by area. It is located to the northwest of Canada. It's one fifth the size of the whole of the US. It became the 49th US state in 1959. It's an attractive state, full of rich countryside and wildlife. There are various mountain ranges in it. It also has the highest mountain in North America, Mount McKinley. It has 100,000 glaciers, 3,000 rivers, and 3 million lakes. Many kinds of animals - like bears, eagles, wolves, sea lions, and whales - live in its oceans, green forests, and snow-covered mountains.<br>It is considered to be one of the more affordable places to live in the US. About 650,000 people live in it. Around 40% of its residents live in the largest city, Anchorage, in the south, because most of the state is very difficult to reach by car. It can be very cold and dark in winter. However, conditions are ideal for exciting activities like skiing, snowboarding, ice fishing, or dog sledding.<br>Alaska is a marvelous place. Each year, it receives millions of visitors who spend money on accommodation, food, and leisure activities. It's like no other place on Earth.`,

    // ==========================================
    // 1. Web Audio API Sound Effects (Clean Synthesized Tones)
    // ==========================================
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSoundEffect(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "correct") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.42);
        } else if (type === "wrong") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.setValueAtTime(210, now + 0.15);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.start(now);
          osc.stop(now + 0.38);
        } else {
          // soft click for reveal essay or add vocab
          osc.type = "sine";
          osc.frequency.setValueAtTime(620, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      } catch (e) {
        // Ignore audio errors if blocked by browser
      }
    }

    function speakEnglishText(text, event) {
      if (event) event.stopPropagation();
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/<[^>]*>/g, " ").replace(/\.{2,}/g, " blank ").trim();
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = "en-US";
      utter.rate = 0.92;
      const voices = window.speechSynthesis.getVoices();
      const usVoice = voices.find(v => v.lang === "en-US" || v.lang === "en_US") || voices.find(v => v.lang.startsWith("en"));
      if (usVoice) utter.voice = usVoice;
      window.speechSynthesis.speak(utter);
    }

    function lookupArabicMeaning(rawWord) {
      const clean = rawWord.toLowerCase().replace(/[^a-z'-]/g, "").replace(/^'+|'+$/g, "");
      if (!clean) return "كلمة إنجليزية";
      if (EXERCISE_DICTIONARY[clean]) return EXERCISE_DICTIONARY[clean];

      // Smart stemmer fallbacks for plurals, -ed, -ing, -ly, possessive 's
      const noPossessive = clean.replace(/'s$/, "");
      if (EXERCISE_DICTIONARY[noPossessive]) return EXERCISE_DICTIONARY[noPossessive];
      if (clean.endsWith("ies") && EXERCISE_DICTIONARY[clean.slice(0, -3) + "y"]) return EXERCISE_DICTIONARY[clean.slice(0, -3) + "y"];
      if (clean.endsWith("es") && EXERCISE_DICTIONARY[clean.slice(0, -2)]) return EXERCISE_DICTIONARY[clean.slice(0, -2)];
      if (clean.endsWith("s") && EXERCISE_DICTIONARY[clean.slice(0, -1)]) return EXERCISE_DICTIONARY[clean.slice(0, -1)];
      if (clean.endsWith("ed") && EXERCISE_DICTIONARY[clean.slice(0, -2)]) return EXERCISE_DICTIONARY[clean.slice(0, -2)];
      if (clean.endsWith("ed") && EXERCISE_DICTIONARY[clean.slice(0, -1)]) return EXERCISE_DICTIONARY[clean.slice(0, -1)];
      if (clean.endsWith("ing") && EXERCISE_DICTIONARY[clean.slice(0, -3)]) return EXERCISE_DICTIONARY[clean.slice(0, -3)];
      if (clean.endsWith("ing") && EXERCISE_DICTIONARY[clean.slice(0, -3) + "e"]) return EXERCISE_DICTIONARY[clean.slice(0, -3) + "e"];
      if (clean.endsWith("ly") && EXERCISE_DICTIONARY[clean.slice(0, -2)]) return EXERCISE_DICTIONARY[clean.slice(0, -2)];

      const commonWords = {
        "the": "الـ (أداة تعريف)", "and": "و", "to": "إلى / أن", "of": "من / لـ", "in": "في",
        "is": "يكون", "are": "يكونون", "was": "كان", "were": "كانوا", "be": "يكون",
        "been": "كان", "have": "يمتلك / قد", "has": "يمتلك / قد", "had": "كان لديه / قد",
        "not": "لا / ليس", "for": "من أجل / لمدة", "with": "مع / بـ", "on": "على",
        "that": "أن / ذلك", "this": "هذا / هذه", "by": "بواسطة / من خلال", "from": "من",
        "as": "كـ / لأن / بينما", "at": "في / عند", "or": "أو", "an": "أداة نكرة", "a": "أداة نكرة",
        "it": "هو / هي (لغير العاقل)", "he": "هو", "she": "هي", "they": "هم", "we": "نحن",
        "you": "أنت / أنتم", "his": "خاصته", "her": "خاصتها", "their": "خاصتهم", "our": "خاصتنا",
        "my": "خاصتي", "your": "خاصتك", "who": "من / الذي", "which": "أي / الذي", "what": "ماذا / ما",
        "where": "أين / حيث", "when": "متى / عندما", "why": "لماذا", "how": "كيف",
        "can": "يستطيع", "could": "كان يستطيع / ربما", "must": "لا بد / يجب", "might": "ربما",
        "may": "قد / ربما", "should": "ينبغي أن", "will": "سوف", "would": "كان سوف",
        "more": "أكثر", "most": "معظم / الأكثر", "many": "العديد من", "some": "بعض",
        "all": "كل / جميع", "other": "آخر", "others": "الآخرين", "new": "جديد", "old": "قديم / مسن",
        "good": "جيد", "well": "جيداً", "first": "أول", "last": "الماضي / الأخير", "one": "واحد",
        "two": "اثنان", "three": "ثلاثة", "about": "عن / حوالي", "after": "بعد", "before": "قبل",
        "over": "عبر / فوق", "into": "إلى داخل", "only": "فقط", "also": "أيضاً", "very": "جداً",
        "so": "لذلك / جداً", "but": "لكن", "if": "إذا / لو", "because": "لأن", "however": "ومع ذلك",
        "although": "على الرغم من", "than": "من (للمقارنة)", "then": "حينئذٍ / ثم", "now": "الآن"
      };
      return commonWords[clean] || "اضغط للاستماع للنطق الأمريكي 🔊 (أضفها لكشكولك)";
    }

    function isWordSavedInVocab(word) {
      const clean = word.toLowerCase().replace(/[^a-z'-]/g, "");
      return vocabNotebook.some(item => item.word.toLowerCase() === clean);
    }

    // Wrap every English word in <span class="translatable-word">
    function wrapTranslatableEnglishWords(text, contextSentence = "") {
      if (!text) return "";
      const safeContext = (contextSentence || text).replace(/<[^>]*>/g, " ").replace(/"/g, "&quot;").slice(0, 160);
      // Split by HTML tags so we don't corrupt markup
      const parts = text.split(/(<[^>]+>)/g);
      return parts.map(part => {
        if (part.startsWith("<")) return part;
        return part.replace(/\b([A-Za-z][A-Za-z'-]*)\b/g, (match) => {
          const savedClass = isWordSavedInVocab(match) ? " saved-in-vocab" : "";
          return `<span class="translatable-word${savedClass}" data-word="${match}" data-context="${safeContext}" onclick="handleWordClick(event, this)">${match}</span>`;
        });
      }).join("");
    }

    function handleWordClick(event, el) {
      event.stopPropagation();
      const rawWord = el.getAttribute("data-word") || el.textContent;
      const context = el.getAttribute("data-context") || rawWord;
      const meaning = lookupArabicMeaning(rawWord);

      currentTooltipWord = rawWord.replace(/[^a-zA-Z'-]/g, "");
      currentTooltipMeaning = meaning;
      currentTooltipContext = context;

      speakEnglishText(currentTooltipWord);
      showWordTooltip(el, currentTooltipWord, meaning);
    }

    // Smart Tooltip Viewport Clamping (Zero Horizontal Overflow on Mobile)
    function showWordTooltip(targetEl, word, meaning) {
      const tooltip = document.getElementById("word-tooltip");
      const wordEl = document.getElementById("tt-eng-word");
      const meaningEl = document.getElementById("tt-ar-meaning");
      const speakBtn = document.getElementById("tt-speak-btn");
      const addBtn = document.getElementById("tt-add-vocab-btn");

      wordEl.textContent = word;
      meaningEl.textContent = meaning;
      speakBtn.onclick = (e) => speakEnglishText(word, e);

      updateTooltipVocabButtonState();

      tooltip.style.display = "block";
      const rect = targetEl.getBoundingClientRect();
      const ttWidth = tooltip.offsetWidth || 280;
      const ttHeight = tooltip.offsetHeight || 130;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let left = rect.left + (rect.width / 2) - (ttWidth / 2);
      if (left < 10) left = 10;
      if (left + ttWidth > vw - 10) left = vw - ttWidth - 10;

      let top = rect.bottom + 8;
      if (top + ttHeight > vh - 12) {
        top = rect.top - ttHeight - 8;
      }
      if (top < 10) top = 10;

      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function updateTooltipVocabButtonState() {
      const addBtn = document.getElementById("tt-add-vocab-btn");
      if (!addBtn) return;
      if (isWordSavedInVocab(currentTooltipWord)) {
        addBtn.textContent = "✅ محفوظة في الكشكول";
        addBtn.style.background = "var(--success)";
        addBtn.onclick = () => openVocabModal();
      } else {
        addBtn.textContent = "➕ أضف لكشكول الكلمات";
        addBtn.style.background = "var(--primary)";
        addBtn.onclick = () => {
          addWordToVocabNotebook(currentTooltipWord, currentTooltipMeaning, currentTooltipContext);
          updateTooltipVocabButtonState();
        };
      }
    }

    document.addEventListener("click", (e) => {
      const tooltip = document.getElementById("word-tooltip");
      if (tooltip && !tooltip.contains(e.target) && !e.target.classList.contains("translatable-word")) {
        tooltip.style.display = "none";
      }
    });

    // 4. Render Study Notes Section (Unit 3 Exam Review)

          <p style="margin:4px 0 12px;color:var(--text-muted);font-weight:600;">💡 اضغط على أي كلمة إنجليزية لسماع نطقها الأمريكي الفوري وإضافتها لكشكول كلماتك!</p>
          <h3 style="color:var(--text-main);font-size:1.05rem;">أولاً: أهم 25 مفردة لغوية (Top 25 Vocabulary)</h3>
          <div class="study-grid">${vocabCardsHtml}</div>

          <h3 style="color:var(--text-main);font-size:1.05rem;margin-top:20px;">ثانياً: 10 جمل مختارة على المفردات اللغوية (Vocabulary through the Exam)</h3>

          <h3 style="color:var(--text-main);font-size:1.05rem;margin-top:20px;">ثالثاً: مصطلحات المقال الإقناعي (Persuasive Writing Terminology)</h3>
          ${writingTermsHtml}

          <h3 style="color:var(--text-main);font-size:1.05rem;margin-top:20px;">رابعاً: 10 جمل مختارة على القواعد اللغوية (Language through the Exam)</h3>

    // ==========================================
    // 5. Render Questions & Teacher-Voice Diagnostic Engine
    // ==========================================
    function renderQuestions() {
      renderStudyNotes();
      const container = document.getElementById("questions-render-container");
      if (!container) return;

      if (currentSection === "study_notes") {
        container.innerHTML = "";
        return;
      }

      if (currentSection === "mistakes_bank") {
        renderMistakesBankView(container);
        return;
      }

      const filtered = ALL_QUESTIONS.filter(q => currentSection === "all" || q.section === currentSection);
      let html = "";
      let renderedPassages = new Set();

      filtered.forEach((q) => {
        // Render Reading Passage Card once before its group of questions
        if (q.passageId && PASSAGES[q.passageId] && !renderedPassages.has(q.passageId)) {
          renderedPassages.add(q.passageId);
          const rawPassage = PASSAGES[q.passageId];
          html += `
            <div class="passage-card">
              <div class="passage-title">
                📖 قطعة القراءة والفهم (اضغط على أي كلمة إنجليزية للترجمة والنطق الفوري)
                <button class="mini-btn" style="float:left;" onclick="speakEnglishText(PASSAGES['${q.passageId}'], event)">🔊 استمع للقطعة</button>
              </div>
              <div style="clear:both;line-height:1.8;font-size:clamp(0.95rem,1.9vw,1.12rem);">
                ${wrapTranslatableEnglishWords(rawPassage, "Reading Passage")}
              </div>
            </div>
          `;
        }

        html += buildQuestionCardHtml(q, false);
      });

      container.innerHTML = html;
      restoreSavedQuestionStates(filtered);
      updateLiveCounters();
    }

    function buildQuestionCardHtml(q, isMistakeRetryMode) {
      const letters = ["A", "B", "C", "D", "E"];
      const stemHtml = wrapTranslatableEnglishWords(q.stem.replace(/\n/g, "<br>"), q.stem);
      const isTwoChoice = q.type === "mcq_two";

      let bodyContent = "";
      if (q.type === "mcq" || q.type === "mcq_two") {
        const twoBadge = isTwoChoice
          ? `<div style="background:var(--warning-bg);color:var(--warning);padding:6px 12px;border-radius:8px;font-weight:800;margin-bottom:8px;font-size:0.9rem;">⚡ تنبيه: اختر إجابتين صحيحتين من الاختيارات الخمسة (Choose TWO answers)</div>`
          : "";

        const optionsHtml = q.options.map((opt, idx) => {
          const wrappedOpt = wrapTranslatableEnglishWords(opt, opt);
          const safeSpeak = opt.replace(/'/g, "\\'").replace(/"/g, "&quot;");
          return `
            <div class="option-btn" id="opt-${q.id}-${idx}" onclick="handleSelectOption('${q.id}', ${idx}, ${isMistakeRetryMode})">
              <div class="option-left">
                <span class="opt-letter">${letters[idx]}</span>
                <span>${wrappedOpt}</span>
              </div>
              <button class="opt-speak-btn" title="نطق الاختيار بالأمريكي" onclick="speakEnglishText('${safeSpeak}', event)">🔊</button>
            </div>
          `;
        }).join("");

        bodyContent = `
          ${twoBadge}
          <div class="options-grid ${q.rtlOptions ? "rtl-options" : ""}">
            ${optionsHtml}
          </div>
          <div class="teacher-exp-box" id="exp-${q.id}"></div>
        `;
      } else {
        // Essay / Rewrite / Dialogue / Open-Ended Mode (NO fake options)
        bodyContent = `
          <textarea class="essay-textarea" id="essay-input-${q.id}" placeholder="✍️ اكتب إجابتك هنا للتدريب قبل كشف إجابة المستر النموذجية..."></textarea>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button class="reveal-essay-btn" onclick="revealEssayAnswer('${q.id}')">👁️ إظهار إجابة المستر النموذجية والتعليل</button>
            <button class="mini-btn" onclick="addEssayToMistakesBank('${q.id}')">🔥 أضف لبنك المراجعة</button>
          </div>
          <div class="teacher-exp-box" id="exp-${q.id}"></div>
        `;
      }

      const safeStemSpeak = q.stem.replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/\n/g, " ");

      return `
        <article class="q-card" id="card-${q.id}">
          <div class="q-header">
            <span class="q-source-badge">${q.sourceBadge}</span>
            <div class="q-actions">
              <button class="mini-btn" onclick="speakEnglishText('${safeStemSpeak}', event)" title="قراءة السؤال باللكنة الأمريكية">🔊 نطق السؤال</button>
              <button class="mini-btn" onclick="toggleQuestionTranslation('${q.id}')" title="إظهار/إخفاء ترجمة السؤال">🌐 الترجمة</button>
            </div>
          </div>
          <div class="q-stem ${q.rtlStem ? "rtl-stem" : ""}">${stemHtml}</div>
          <div class="q-translation-box" id="trans-${q.id}">🇻🇬 الترجمة: ${q.translation}</div>
          ${bodyContent}
        </article>
      `;
    }

    function toggleQuestionTranslation(qId) {
      const box = document.getElementById(`trans-${qId}`);
      if (!box) return;
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    // Handle MCQ Selection (Supports both standard 4-option MCQ and 5-option Choose TWO)
    function handleSelectOption(qId, selectedIdx, isMistakeRetryMode = false) {
      const q = ALL_QUESTIONS.find(item => item.id === qId);
      if (!q) return;

      if (!isMistakeRetryMode && userAnswersState[qId] && userAnswersState[qId].completed) {
        return; // Already answered
      }

      if (q.type === "mcq_two") {
        if (!twoChoiceSelections[qId]) twoChoiceSelections[qId] = [];
        const arr = twoChoiceSelections[qId];
        if (arr.includes(selectedIdx)) return;
        arr.push(selectedIdx);

        const clickedBtn = document.getElementById(`opt-${qId}-${selectedIdx}`);
        if (clickedBtn) {
          clickedBtn.style.borderColor = "var(--primary)";
          clickedBtn.style.background = "var(--bg-accent)";
        }

        if (arr.length < 2) {
          playSoundEffect("click");
          return; // Wait for second selection
        }

        // Evaluate 2 selections
        const isCorrect = q.correctIndices.every(ci => arr.includes(ci));
        finalizeMcqEvaluation(q, arr, isCorrect, isMistakeRetryMode);
      } else {
        const isCorrect = selectedIdx === q.correct;
        finalizeMcqEvaluation(q, [selectedIdx], isCorrect, isMistakeRetryMode);
      }
    }

    function finalizeMcqEvaluation(q, selectedArr, isCorrect, isMistakeRetryMode) {
      const correctArr = q.type === "mcq_two" ? q.correctIndices : [q.correct];

      q.options.forEach((_, idx) => {
        const btn = document.getElementById(`opt-${q.id}-${idx}`);
        if (!btn) return;
        btn.classList.add("disabled");
        if (correctArr.includes(idx)) {
          btn.classList.add("correct-choice");
        } else if (selectedArr.includes(idx)) {
          btn.classList.add("wrong-choice");
        }
      });

      if (isCorrect) {
        playSoundEffect("correct");
      } else {
        playSoundEffect("wrong");
        addToMistakesBank(q.id, selectedArr);
      }

      if (!isMistakeRetryMode) {
        userAnswersState[q.id] = { completed: true, selectedArr, isCorrect };
        localStorage.setItem(STORAGE_KEYS.ANSWERS, JSON.stringify(userAnswersState));
      }

      renderTeacherExplanation(q, selectedArr, isCorrect, isMistakeRetryMode);
      updateLiveCounters();
    }

    // Teacher-Voice AI Diagnostic Function
    function renderTeacherExplanation(q, selectedArr, isCorrect, isMistakeRetryMode) {

      if (!expBox) return;

      let breakdownHtml = `<div class="exp-Option-breakdown">`;

        if (correctArr.includes(idx)) {
          breakdownHtml += `
            <div class="exp-item" style="border-right:4px solid var(--success);">
              <strong>✅ ليه المستر اختار الإجابة الصح (${letters[idx]} - ${wrapTranslatableEnglishWords(opt, opt)})؟</strong><br>

            </div>
          `;
        } else {
          const wrongReason = (q.whyWrong && q.whyWrong[idx]) ? q.whyWrong[idx] : "لا تناسب السياق أو القاعدة اللغوية في هذه الجملة.";
          breakdownHtml += `
            <div class="exp-item" style="border-right:4px solid var(--danger);">
              <strong>❌ ليه المستر استبعد الاختيار الغلط (${letters[idx]} - ${wrapTranslatableEnglishWords(opt, opt)})؟</strong><br>
              المستر قال لك الإجابة دي متنفعش هنا عشان: ${wrapTranslatableEnglishWords(wrongReason, wrongReason)}
            </div>
          `;
        }
      });
      breakdownHtml += `</div>`;

      // Quick button to add both the right word and mistaken word to Vocab Notebook
      let quickVocabBtn = "";
      if (!isCorrect) {
        const rightWordClean = q.options[correctArr[0]].replace(/'/g, "\\'");
        const wrongWordClean = q.options[selectedArr[0]].replace(/'/g, "\\'");
        quickVocabBtn = `
          <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;">
            <button class="mini-btn" style="background:var(--warning-bg);border-color:var(--warning);" onclick="quickAddMistakeWordsToVocab('${rightWordClean}', '${wrongWordClean}', '${q.id}')">
              📓 أضف الكلمة الصحيحة وكلمة غلطتك لكشكول الكلمات
            </button>
          </div>
        `;
      }

      let masteryBtn = "";
      if (isMistakeRetryMode && isCorrect) {
        masteryBtn = `
          <div style="margin-top:12px;">
            <button class="reveal-essay-btn" style="background:var(--success);" onclick="removeQuestionFromMistakesBank('${q.id}')">
              ✅ تم إتقان السؤال - احذفه من بنك الغلطات
            </button>
          </div>
        `;
      }

      expBox.innerHTML = headerMsg + breakdownHtml + quickVocabBtn + masteryBtn;
      expBox.style.display = "block";
    }

    function revealEssayAnswer(qId) {
      const q = ALL_QUESTIONS.find(item => item.id === qId);
      if (!q) return;
      playSoundEffect("click");

      const expBox = document.getElementById(`exp-${qId}`);
      if (!expBox) return;

      const safeSpeakAns = q.modelAnswer.replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/\n/g, " ");

      expBox.innerHTML = `
        <div style="margin-bottom:10px;">
          <strong style="color:var(--success);font-size:1.05rem;">✅ الإجابة النموذجية التي اعتمدها ${TEACHER_CONFIG.name}:</strong>
          <button class="mini-btn" style="float:left;" onclick="speakEnglishText('${safeSpeakAns}', event)">🔊 نطق الإجابة</button>
          <div style="clear:both;direction:ltr;text-align:left;background:var(--bg-card);padding:12px;border-radius:8px;border:1px solid var(--success);margin-top:6px;font-weight:700;">
            ${wrapTranslatableEnglishWords(q.modelAnswer.replace(/\n/g, "<br>"), q.modelAnswer)}
          </div>
        </div>
        <div style="margin-bottom:10px;background:var(--bg-card);padding:10px 12px;border-radius:8px;border:1px solid var(--border-color);">
          <strong>🇻🇬 الترجمة العربية للإجابة النموذجية:</strong><br>
          ${q.modelAnswerAr}
        </div>
        <div style="background:var(--warning-bg);padding:10px 12px;border-radius:8px;border-right:4px solid var(--warning);">
          <strong>💡 تعليل وشرح المستر للإجابة:</strong><br>
          ${wrapTranslatableEnglishWords(q.teacherReasoning, q.teacherReasoning)}
        </div>
      `;
      expBox.style.display = "block";
    }

    function restoreSavedQuestionStates(questionsList) {
      questionsList.forEach(q => {
        const saved = userAnswersState[q.id];
        if (saved && saved.completed && (q.type === "mcq" || q.type === "mcq_two")) {
          finalizeMcqEvaluation(q, saved.selectedArr, saved.isCorrect, false);
        }
      });
    }

    // ==========================================
    // 6. Interactive Mistakes Bank Engine
    // ==========================================
    function addToMistakesBank(qId, selectedArr) {
      const existingIdx = mistakesBank.findIndex(m => m.qId === qId);
      if (existingIdx >= 0) {
        mistakesBank[existingIdx].selectedArr = selectedArr;
      } else {
        mistakesBank.push({ qId, selectedArr, timestamp: Date.now() });
      }
      localStorage.setItem(STORAGE_KEYS.MISTAKES, JSON.stringify(mistakesBank));
      updateLiveCounters();
    }

    function addEssayToMistakesBank(qId) {
      playSoundEffect("click");
      addToMistakesBank(qId, []);
      alert("✅ تم إضافة هذا السؤال المقالي إلى 🔥 بنك الغلطات والمراجعة الذكي!");
    }

    function removeQuestionFromMistakesBank(qId) {
      playSoundEffect("correct");
      mistakesBank = mistakesBank.filter(m => m.qId !== qId);
      localStorage.setItem(STORAGE_KEYS.MISTAKES, JSON.stringify(mistakesBank));
      updateLiveCounters();
      if (currentSection === "mistakes_bank") {
        renderQuestions();
      }
    }

    function clearAllMistakesBank() {
      if (!confirm("هل أنت متأكد من تصفير بنك الغلطات بالكامل لبدء حصة جديدة؟")) return;
      mistakesBank = [];
      localStorage.setItem(STORAGE_KEYS.MISTAKES, JSON.stringify(mistakesBank));
      updateLiveCounters();
      renderQuestions();
    }

    function toggleMistakesRetryQuiz() {
      mistakesQuizMode = !mistakesQuizMode;
      twoChoiceSelections = {};
      renderQuestions();
    }

    function renderMistakesBankView(container) {
      if (mistakesBank.length === 0) {
        container.innerHTML = `
          <div class="study-section-box" style="text-align:center;padding:40px 20px;">
            <h2 style="color:var(--success);margin-top:0;">🎉 بنك الغلطات فارغ تماماً يا بطل!</h2>
            <p style="font-weight:700;color:var(--text-muted);">أي سؤال تخطئ فيه أثناء الحل أو تضيفه للمراجعة سيظهر هنا فوراً مع تعليل المستر.</p>
          </div>
        `;
        return;
      }

      let headerHtml = `
        <div class="study-section-box" style="border:2px solid var(--danger);">
          <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
            <div>
              <h2 style="margin:0;color:var(--danger);">🔥 بنك الغلطات والتشخيص الذكي (${mistakesBank.length} سؤال)</h2>
              <p style="margin:4px 0 0;color:var(--text-muted);font-weight:600;">راجع أخطاءك وتعلم من تعليل ${TEACHER_CONFIG.name} أو امتحن نفسك فيها من جديد.</p>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <button class="reveal-essay-btn" style="background:var(--primary);" onclick="toggleMistakesRetryQuiz()">
                ${mistakesQuizMode ? "📖 عرض تقرير الأخطاء والتعليلات" : "🔄 امتحنّي في غلطاتي فقط"}
              </button>
              <button class="ctrl-btn" style="color:var(--danger);border-color:var(--danger);" onclick="clearAllMistakesBank()">
                🗑️ تصفير بنك الغلطات بالكامل
              </button>
            </div>
          </div>
        </div>
      `;

      const letters = ["A", "B", "C", "D", "E"];
      let cardsHtml = "";

      mistakesBank.forEach(item => {
        const q = ALL_QUESTIONS.find(question => question.id === item.qId);
        if (!q) return;

        if (mistakesQuizMode) {
          cardsHtml += buildQuestionCardHtml(q, true);
        } else {
          if (q.type === "mcq" || q.type === "mcq_two") {
            const correctArr = q.type === "mcq_two" ? q.correctIndices : [q.correct];
            const wrongText = (item.selectedArr && item.selectedArr.length)
              ? item.selectedArr.map(i => `(${letters[i]}) ${q.options[i]}`).join(" & ")
              : "لم يتم الاختيار";
            const rightText = correctArr.map(i => `(${letters[i]}) ${q.options[i]}`).join(" & ");

            cardsHtml += `
              <div class="q-card" style="border-right:5px solid var(--danger);">
                <div class="q-header">
                  <span class="q-source-badge">${q.sourceBadge}</span>
                  <button class="mini-btn" style="color:var(--success);" onclick="removeQuestionFromMistakesBank('${q.id}')">✅ تم إتقان السؤال - احذفه</button>
                </div>
                <div class="q-stem ${q.rtlStem ? "rtl-stem" : ""}">${wrapTranslatableEnglishWords(q.stem, q.stem)}</div>
                <div style="padding:10px 14px;border-radius:8px;background:var(--danger-bg);margin-bottom:8px;font-weight:700;">
                  ❌ إجابتك الخاطئة كانت: <span style="direction:ltr;display:inline-block;">${wrapTranslatableEnglishWords(wrongText, wrongText)}</span>
                </div>
                <div style="padding:10px 14px;border-radius:8px;background:var(--success-bg);margin-bottom:8px;font-weight:700;">
                  ✅ الإجابة الصحيحة التي اختارها المستر هي: <span style="direction:ltr;display:inline-block;">${wrapTranslatableEnglishWords(rightText, rightText)}</span>
                </div>
                <div style="padding:10px 14px;border-radius:8px;background:var(--bg-soft);font-weight:600;">
                  💡 <strong>تعليل ${TEACHER_CONFIG.name} للغلطة:</strong> ${wrapTranslatableEnglishWords(q.whyRight, q.whyRight)}
                </div>
              </div>
            `;
          } else {
            cardsHtml += buildQuestionCardHtml(q, true);
          }
        }
      });

      container.innerHTML = headerHtml + cardsHtml;
    }

    // ==========================================
    // 7. Interactive Vocab Notebook Engine
    // ==========================================
    function addWordToVocabNotebook(word, meaning, contextSentence) {
      const clean = word.trim();
      if (!clean) return;
      if (!isWordSavedInVocab(clean)) {
        vocabNotebook.unshift({
          word: clean,
          meaning: meaning || lookupArabicMeaning(clean),
          context: contextSentence || clean
        });
        localStorage.setItem(STORAGE_KEYS.VOCAB, JSON.stringify(vocabNotebook));
        playSoundEffect("click");
      }
      highlightSavedWordsInDOM();
      updateLiveCounters();
    }

    function quickAddMistakeWordsToVocab(rightWord, wrongWord, qId) {
      const q = ALL_QUESTIONS.find(item => item.id === qId);
      const context = q ? q.stem : "";
      addWordToVocabNotebook(rightWord, lookupArabicMeaning(rightWord), context);
      addWordToVocabNotebook(wrongWord, lookupArabicMeaning(wrongWord), context);
      alert(`📓 تم إضافة (${rightWord}) و (${wrongWord}) إلى كشكول الكلمات بنجاح!`);
    }

    function highlightSavedWordsInDOM() {
      document.querySelectorAll(".translatable-word").forEach(el => {
        const w = el.getAttribute("data-word") || el.textContent;
        if (isWordSavedInVocab(w)) {
          el.classList.add("saved-in-vocab");
        } else {
          el.classList.remove("saved-in-vocab");
        }
      });
    }

    function openVocabModal() {
      const modal = document.getElementById("vocab-modal-overlay");
      if (!modal) return;
      renderVocabNotebookList();
      modal.style.display = "flex";
    }

    function closeVocabModal() {
      const modal = document.getElementById("vocab-modal-overlay");
      if (modal) modal.style.display = "none";
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }

    function renderVocabNotebookList() {
      const listEl = document.getElementById("vocab-notebook-list");
      if (!listEl) return;

      if (vocabNotebook.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center;padding:30px;background:var(--bg-soft);border-radius:12px;">
            <h3 style="margin-top:0;color:var(--primary);">📓 كشكول كلماتك فارغ حالياً</h3>
            <p style="font-weight:600;color:var(--text-muted);">اضغط على أي كلمة إنجليزية في الأسئلة أو القطع أو الاختيارات ثم اضغط على زر «➕ أضف لكشكول الكلمات» لحفظها ومراجعتها هنا.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = vocabNotebook.map((item, idx) => `
        <div class="q-card" style="margin-bottom:10px;padding:14px;">
          <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <button class="opt-speak-btn" onclick="speakEnglishText('${item.word.replace(/'/g, "\\'")}', event)">🔊</button>
              <div>
                <strong style="font-size:1.15rem;color:var(--primary);direction:ltr;display:inline-block;">${item.word}</strong>
                <span style="margin-right:10px;font-weight:800;color:var(--text-main);">— ${item.meaning}</span>
              </div>
            </div>
            <button class="mini-btn" style="color:var(--danger);" onclick="deleteWordFromVocab(${idx})">🗑️ حذف كلمة</button>
          </div>
          <div style="margin-top:8px;font-size:0.9rem;color:var(--text-muted);direction:ltr;text-align:left;background:var(--bg-soft);padding:6px 10px;border-radius:6px;">
            📝 المثال/السياق: ${item.context}
          </div>
        </div>
      `).join("");
    }

    function deleteWordFromVocab(index) {
      vocabNotebook.splice(index, 1);
      localStorage.setItem(STORAGE_KEYS.VOCAB, JSON.stringify(vocabNotebook));
      highlightSavedWordsInDOM();
      renderVocabNotebookList();
      updateLiveCounters();
    }

    function clearAllVocabNotebook() {
      if (!confirm("هل تريد مسح كشكول الكلمات بالكامل؟")) return;
      vocabNotebook = [];
      localStorage.setItem(STORAGE_KEYS.VOCAB, JSON.stringify(vocabNotebook));
      highlightSavedWordsInDOM();
      renderVocabNotebookList();
      updateLiveCounters();
    }

    function speakAllVocabNotebook() {
      if (vocabNotebook.length === 0) return;
      const allWords = vocabNotebook.map(v => v.word).join(". ");
      speakEnglishText(allWords);
    }

    function startVocabMiniQuiz() {
      const quizArea = document.getElementById("vocab-quiz-area");
      if (!quizArea) return;
      if (vocabNotebook.length === 0) {
        alert("أضف كلمة واحدة على الأقل إلى كشكول الكلمات أولاً ليتم اختبارك فيها!");
        return;
      }

      const target = vocabNotebook[Math.floor(Math.random() * vocabNotebook.length)];
      const distractorPool = UNIT3_STUDY_DATA.top25Vocab
        .map(v => v.ar)
        .filter(ar => ar !== target.meaning);

      const shuffledDistractors = distractorPool.sort(() => 0.5 - Math.random()).slice(0, 3);
      const quizOptions = [target.meaning, ...shuffledDistractors].sort(() => 0.5 - Math.random());

      quizArea.style.display = "block";
      quizArea.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <strong style="color:var(--primary);font-size:1.05rem;">🎯 اختبار سريع في كلمات كشكولك: ما معنى كلمة (<span style="direction:ltr;display:inline-block;">${target.word}</span>)؟</strong>
          <button class="opt-speak-btn" onclick="speakEnglishText('${target.word.replace(/'/g, "\\'")}', event)">🔊</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;">
          ${quizOptions.map(opt => `
            <button class="ctrl-btn" onclick="checkVocabQuizAnswer(this, '${opt.replace(/'/g, "\\'")}', '${target.meaning.replace(/'/g, "\\'")}')">${opt}</button>
          `).join("")}
        </div>
        <div id="vocab-quiz-feedback" style="margin-top:10px;font-weight:800;"></div>
      `;
    }

    function checkVocabQuizAnswer(btn, chosen, correct) {
      const fb = document.getElementById("vocab-quiz-feedback");
      if (chosen === correct) {
        playSoundEffect("correct");
        btn.style.background = "var(--success)";
        btn.style.color = "#fff";
        fb.style.color = "var(--success)";
        fb.innerHTML = `✅ إجابة ممتازة يا بطل! <button class="mini-btn" style="margin-right:8px;" onclick="startVocabMiniQuiz()">سؤال آخر 🔄</button>`;
      } else {
        playSoundEffect("wrong");
        btn.style.background = "var(--danger)";
        btn.style.color = "#fff";
        fb.style.color = "var(--danger)";
        fb.textContent = `❌ حاول مرة أخرى! المعنى الصحيح هو: ${correct}`;
      }
    }

    // ==========================================
    // 8. Navigation, Counters, Zoom & Theme Controls
    // ==========================================
    function switchSection(sec) {
      currentSection = sec;
      mistakesQuizMode = false;
      document.querySelectorAll("#sidebar-nav-list .nav-btn").forEach(btn => btn.classList.remove("active"));
      const buttons = document.querySelectorAll("#sidebar-nav-list .nav-btn");
      const sectionOrder = ["all", "study_notes", "sample_test_5", "sample_test_6", "azhar_bank", "review_1", "mistakes_bank"];
      const idx = sectionOrder.indexOf(sec);
      if (idx >= 0 && buttons[idx]) buttons[idx].classList.add("active");

      closeMobileDrawer();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateLiveCounters() {
      const totalQ = ALL_QUESTIONS.length;
      const correctCount = Object.values(userAnswersState).filter(v => v && v.isCorrect).length;

      document.getElementById("stat-total").textContent = totalQ;
      document.getElementById("stat-correct").textContent = correctCount;
      document.getElementById("stat-wrong").textContent = mistakesBank.length;

      document.getElementById("count-all").textContent = totalQ;
      document.getElementById("count-st5").textContent = ALL_QUESTIONS.filter(q => q.section === "sample_test_5").length;
      document.getElementById("count-st6").textContent = ALL_QUESTIONS.filter(q => q.section === "sample_test_6").length;
      document.getElementById("count-azhar").textContent = ALL_QUESTIONS.filter(q => q.section === "azhar_bank").length;
      document.getElementById("count-rev1").textContent = ALL_QUESTIONS.filter(q => q.section === "review_1").length;
      document.getElementById("count-mistakes").textContent = mistakesBank.length;

      document.getElementById("count-vocab-side").textContent = vocabNotebook.length;
      document.getElementById("fab-vocab-count").textContent = vocabNotebook.length;
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const btn = document.getElementById("theme-toggle-btn");
      if (htmlEl.getAttribute("data-theme") === "dark") {
        htmlEl.setAttribute("data-theme", "light");
        btn.textContent = "🌙 الوضع الليلي";
      } else {
        htmlEl.setAttribute("data-theme", "dark");
        btn.textContent = "☀️ الوضع النهاري";
      }
    }

    let currentZoom = 1;
    function adjustZoom(delta) {
      currentZoom = Math.min(1.4, Math.max(0.85, currentZoom + delta));
      document.documentElement.style.setProperty("--zoom-scale", currentZoom);
    }

    function toggleSidebarDesktop() {
      const container = document.getElementById("main-app-container");
      if (window.innerWidth <= 768) {
        openMobileDrawer();
      } else {
        container.classList.toggle("sidebar-collapsed");
      }
    }

    function openMobileDrawer() {
      document.getElementById("app-sidebar").classList.add("open-drawer");
    }

    function closeMobileDrawer() {
      document.getElementById("app-sidebar").classList.remove("open-drawer");
    }

    // Initialize Application on Load
    window.addEventListener("DOMContentLoaded", () => {
      initTeacherBranding();
      renderQuestions();
      updateLiveCounters();
    });
  </script>
</body>
</html>
